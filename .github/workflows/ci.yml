name: CI 自動化建置與測試

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: 簽出原始碼
        uses: actions/checkout@v4

      - name: 安裝 .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 還原依賴套件
        run: dotnet restore dotnet-src/PaperSwitch.sln

      - name: 建置方案 (Release)
        run: dotnet build dotnet-src/PaperSwitch.sln -c Release --no-restore

      - name: 執行單元測試
        run: dotnet test dotnet-src/PaperSwitch.sln -c Release --no-build --verbosity normal
